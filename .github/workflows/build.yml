name: verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated integration test scripts. Empty = configured suite.'
        required: false
        default: ''

permissions:
  contents: read

env:
  MANUL_CI_TESTS: |
    aicode/test_chroma_lifecycle.sh
    aicode/test_caracal_mcp.sh
    aicode/test_openclaw_snapshot.sh
    aicode/test_opencode_acp_caracal.sh
    skills/globalskills-repository/test_agent_modes.sh

jobs:
  verify-macos:
    name: Verify native macOS Manul and aicode integration
    runs-on: macos-latest
    env:
      MANUL_CANONICAL_ROOT: ${{ github.workspace }}/manul-repo
      MANUL_CANONICAL_DIR: ${{ github.workspace }}/manul-repo/skills/manul-github-bot
      MANUL_CANONICAL_BRANCH: main
    steps:
      - name: Checkout globalskills
        uses: actions/checkout@v4
      - name: Checkout standalone Manul runtime
        uses: actions/checkout@v4
        with:
          repository: mariuszmarzec/manul
          ref: main
          path: manul-repo
      - name: Install macOS runtime dependencies
        run: brew install bash coreutils util-linux jq sqlite gh
      - name: Add Homebrew runtime tools to PATH
        run: |
          prefix="$(brew --prefix)"
          echo "$prefix/opt/bash/bin" >> "$GITHUB_PATH"
          echo "$prefix/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$prefix/opt/util-linux/bin" >> "$GITHUB_PATH"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Verify platform bootstrap and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test "${BASH_VERSINFO[0]}" -ge 4
          source "$MANUL_CANONICAL_DIR/manul-platform.sh"
          manul_platform_prepare
          for command in bash flock setsid timeout realpath stat sha256sum; do
            command -v "$command"
          done
          bash -n aicode/aicode
          bash -n aicode/chroma-lifecycle.sh
          while IFS= read -r script; do bash -n "$script"; done < <(find "$MANUL_CANONICAL_DIR" -maxdepth 1 -type f -name '*.sh' -print)
      - name: Run native Todo MCP and adapter integration tests
        shell: bash
        run: |
          set -euo pipefail
          bash aicode/test_caracal_mcp.sh
          bash "$MANUL_CANONICAL_DIR/test_todo_task_sources.sh"
          bash "$MANUL_CANONICAL_DIR/test_adapters.sh"

  verify:
    name: Verify skills and standalone Manul integration
    runs-on: ubuntu-latest
    env:
      MANUL_CANONICAL_ROOT: ${{ github.workspace }}/manul-repo
      MANUL_CANONICAL_DIR: ${{ github.workspace }}/manul-repo/skills/manul-github-bot
      MANUL_CANONICAL_BRANCH: main
    steps:
      - name: Checkout globalskills
        uses: actions/checkout@v4
      - name: Checkout standalone Manul runtime
        uses: actions/checkout@v4
        with:
          repository: mariuszmarzec/manul
          ref: main
          path: manul-repo
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 util-linux gh
      - name: Run benchmark framework unit tests
        run: python3 -m unittest discover -s skill-benchmarks/tests -v
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find "$MANUL_CANONICAL_DIR" -maxdepth 1 -type f -name '*.sh' -print | sort)
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done
          for script in aicode/aicode aicode/chroma-lifecycle.sh aicode/test_chroma_lifecycle.sh aicode/openclaw-config-snapshot.sh aicode/test_openclaw_snapshot.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - name: Run Todo MCP client unit tests
        run: python3 "$MANUL_CANONICAL_DIR/test_todo_mcp_client.py"
      - name: Run configured globalskills integration tests
        env:
          REQUESTED_TESTS: ${{ inputs.tests }}
        shell: bash
        run: |
          set -uo pipefail
          test_list="${REQUESTED_TESTS:-$MANUL_CI_TESTS}"
          mapfile -t configured < <(printf '%s\n' "$MANUL_CI_TESTS" | sed '/^[[:space:]]*$/d')
          mapfile -t requested < <(printf '%s\n' "$test_list" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d')
          declare -A allowed=()
          for script in "${configured[@]}"; do allowed["$script"]=1; done
          mkdir -p test-results
          passed=0
          failed=0
          for script in "${requested[@]}"; do
            if [ -z "${allowed[$script]:-}" ]; then
              echo "Test is not part of the CI allowlist: $script"
              exit 1
            fi
            if [ ! -f "$script" ]; then
              echo "Configured test does not exist: $script"
              exit 1
            fi
            name="$(basename "$script" .sh)"
            log="test-results/${name}.log"
            echo "Running: $script"
            start_ts="$(date +%s)"
            set +e
            timeout --signal=TERM --kill-after=10s 180s bash "$script" >"$log" 2>&1
            rc=$?
            set -e
            duration="$(( $(date +%s) - start_ts ))s"
            cat "$log"
            if [ "$rc" -eq 0 ]; then
              echo "Suite passed (${duration}): $script"
              passed=$((passed + 1))
            else
              echo "Suite failed or timed out (${duration}, exit=$rc): $script"
              failed=$((failed + 1))
            fi
          done
          echo "Passed suites: $passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed suites: $failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Upload integration test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: globalskills-integration-test-logs
          path: test-results/
          if-no-files-found: ignore
