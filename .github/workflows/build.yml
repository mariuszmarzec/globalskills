name: verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated CI test scripts. Empty = configured CI suite.'
        required: false
        default: ''

permissions:
  contents: read

env:
  MANUL_CI_TESTS: |
    skills/manul-github-bot/test_manul_cli.sh
    skills/manul-github-bot/test_workspace_behavior.sh
    skills/manul-github-bot/test_pool_recovery.sh
    skills/manul-github-bot/test_github_control_protocol.sh
    skills/manul-github-bot/test_github_control_integration.sh
    skills/manul-github-bot/test_prompt_generation.sh
    skills/manul-github-bot/test_conversation_orchestrator.sh
    skills/manul-github-bot/test_conversation_regressions.sh
    skills/manul-github-bot/test_runtime_health.sh
    skills/manul-github-bot/test_conversation_strict.sh
    skills/manul-github-bot/test_error_observability.sh
    skills/manul-github-bot/test_verify_result_comment.sh
    skills/manul-github-bot/test_poll_timeout.sh
    skills/manul-github-bot/test_worker_lease_recovery.sh

jobs:
  verify:
    name: Verify skills and Manul tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find skills/manul-github-bot -maxdepth 1 -type f -name '*.sh' -print | sort)
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - name: Run configured Manul tests
        env:
          REQUESTED_TESTS: ${{ inputs.tests }}
        shell: bash
        run: |
          set -uo pipefail
          test_list="${REQUESTED_TESTS:-$MANUL_CI_TESTS}"
          mapfile -t configured < <(printf '%s\n' "$MANUL_CI_TESTS" | sed '/^[[:space:]]*$/d')
          mapfile -t requested < <(printf '%s\n' "$test_list" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d')
          declare -A allowed=()
          for script in "${configured[@]}"; do allowed["$script"]=1; done
          mkdir -p test-results
          passed=0
          failed=0
          for script in "${requested[@]}"; do
            if [ -z "${allowed[$script]:-}" ]; then
              echo "Test is not part of the CI allowlist: $script"
              exit 1
            fi
            if [ ! -f "$script" ]; then
              echo "Configured test does not exist: $script"
              exit 1
            fi
            name="$(basename "$script" .sh)"
            log="test-results/${name}.log"
            echo "Running: $script"
            if timeout --signal=TERM --kill-after=10s 180s bash "$script" 2>&1 | tee "$log"; then
              passed=$((passed + 1))
            else
              rc=${PIPESTATUS[0]}
              echo "Suite failed or timed out (exit=$rc): $script"
              failed=$((failed + 1))
            fi
          done
          echo "Passed suites: $passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed suites: $failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manul-ci-test-logs
          path: test-results/
          if-no-files-found: ignore
