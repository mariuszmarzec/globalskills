name: verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma-separated CI test scripts. Empty = configured CI suite.'
        required: false
        default: ''

permissions:
  contents: write

env:
  MANUL_CI_TESTS: |
    skills/manul-github-bot/test_manul_cli.sh
    skills/manul-github-bot/test_workspace_behavior.sh
    skills/manul-github-bot/test_github_control_protocol.sh
    skills/manul-github-bot/test_github_control_integration.sh
    skills/manul-github-bot/test_prompt_generation.sh
    skills/manul-github-bot/test_conversation_orchestrator.sh
    skills/manul-github-bot/test_conversation_regressions.sh

jobs:
  verify:
    name: Verify skills and Manul tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply targeted conversation fix
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 19 && github.event.pull_request.head.sha == '09ef6d80064246aca99b3f9255a9407800d44cb8'
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('skills/manul-github-bot/poll.sh')
          s = p.read_text()

          old = '''  local esc_repo esc_author esc_body esc_url esc_type message_id
  esc_repo="$(sql_escape "$repo")"
  esc_author="$(sql_escape "$author")"
  esc_body="$(sql_escape "$body")"
  esc_url="$(sql_escape "$url")"
  esc_type="$(sql_escape "$message_type")"
  message_id="$(uuidgen)"
'''
          new = '''  local esc_repo esc_author esc_body esc_url esc_type message_id
  esc_repo="$(sql_escape "$repo")"
  esc_author="$(sql_escape "$author")"
  esc_body="$(sql_escape "$body")"
  esc_url="$(sql_escape "$url")"
  esc_type="$(sql_escape "$message_type")"

  local already_persisted
  already_persisted="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"
  [ "$already_persisted" = "1" ] && return 0

  message_id="$(uuidgen)"
'''
          if s.count(old) != 1:
              raise SystemExit(f'persist block match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      agent="$(jq -r '.agent // ""' <<<"$obj")"
      action="$(jq -r '.action // ""' <<<"$obj")"
      [ -n "$prompt" ] || continue
      esc="$(printf '%s' "$prompt" | sed "s/'/''/g")"
'''
          new = '''      agent="$(jq -r '.agent // ""' <<<"$obj")"
      action="$(jq -r '.action // ""' <<<"$obj")"
      [ -n "$prompt" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue
      esc="$(printf '%s' "$prompt" | sed "s/'/''/g")"
'''
          if s.count(old) != 1:
              raise SystemExit(f'issue-body match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      # Determine conversation ID based on comment count and thread structure
      raw_id="$(jq -r '.id' <<<"$obj")"
      raw_id="${raw_id#review:}"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      conv_id=""
      pr_comment_count="${PR_COMMENT_COUNTS[$pr_num]:-0}"
      if [ "$pr_comment_count" -eq 1 ]; then
        # Single standalone comment gets pr-top-level conversation
        conv_id="$(generate_conversation_id "$repo" "$pr_num" "pr-top-level")"
      elif [ -n "$reply_to" ]; then
        # Inline reply - find thread root
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
        [ -n "$root_id" ] && conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")"
      else
        # Top-level comment in a multi-comment PR gets review-thread with its own ID
        conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$raw_id")"
      fi
      [ -n "$conv_id" ] || continue
'''
          new = '''      # Every inline review comment belongs to its review thread.
      raw_id="$(jq -r '.rawId // .id' <<<"$obj")"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      conv_id=""
      if [ -n "$reply_to" ]; then
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
      else
        root_id="$raw_id"
      fi
      [ -n "$root_id" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue
'''
          if s.count(old) != 1:
              raise SystemExit(f'review block match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''      # Group review comments by thread root
      local seen_roots=""
      while IFS= read -r comment; do
'''
          new = '''      while IFS= read -r comment; do
'''
          if s.count(old) != 1:
              raise SystemExit(f'seen_roots header match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        # Skip if we've already processed this thread
        echo "$seen_roots" | grep -qxF "$root_id" && continue
        seen_roots="$(printf '%s\n%s' "$seen_roots" "$root_id")"

        # Create or get conversation for this review thread
'''
          new = '''        # Create or get conversation for this review thread
'''
          if s.count(old) != 1:
              raise SystemExit(f'seen_roots skip match count={s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          subprocess.run(['bash', '-n', str(p)], check=True)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(p)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Fix conversation thread persistence'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:${{ github.event.pull_request.head.ref }}'], shell=True, check=True)
          print('targeted fix committed and pushed')

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find skills/manul-github-bot -maxdepth 1 -type f -name '*.sh' -print | sort)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo 'No shell scripts found under skills/manul-github-bot'
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
          done

      - name: Run configured Manul tests
        env:
          REQUESTED_TESTS: ${{ inputs.tests }}
        shell: bash
        run: |
          set -uo pipefail

          test_list="${REQUESTED_TESTS:-$MANUL_CI_TESTS}"
          mapfile -t configured < <(printf '%s\n' "$MANUL_CI_TESTS" | sed '/^[[:space:]]*$/d')
          mapfile -t requested < <(printf '%s\n' "$test_list" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d')

          declare -A allowed=()
          for script in "${configured[@]}"; do
            allowed["$script"]=1
          done

          mkdir -p test-results
          passed=0
          failed=0

          if [ "${#requested[@]}" -eq 0 ]; then
            echo 'No tests configured.'
            exit 1
          fi

          for script in "${requested[@]}"; do
            if [ -z "${allowed[$script]:-}" ]; then
              echo "Test is not part of the CI allowlist: $script"
              echo 'Allowed tests:'
              printf '  %s\n' "${configured[@]}"
              exit 1
            fi
            if [ ! -f "$script" ]; then
              echo "Configured test does not exist: $script"
              exit 1
            fi
            name="$(basename "$script" .sh)"
            log="test-results/${name}.log"
            echo "=================================================="
            echo "Running: $script"
            echo "=================================================="
            if bash "$script" 2>&1 | tee "$log"; then
              passed=$((passed + 1))
              echo "PASS: $script"
            else
              failed=$((failed + 1))
              echo "FAIL: $script"
            fi
          done

          {
            echo '## Manul CI tests'
            echo
            echo "- Passed suites: $passed"
            echo "- Failed suites: $failed"
            echo
            echo '### Executed'
            for script in "${requested[@]}"; do
              echo "- \`$script\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manul-ci-test-logs
          path: test-results/
          if-no-files-found: ignore
