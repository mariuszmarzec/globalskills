name: verification

on:
  pull_request:
    branches:
      - '*'
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

env:
  MANUL_CI_TESTS: |
    skills/manul-github-bot/test_manul_cli.sh
    skills/manul-github-bot/test_workspace_behavior.sh
    skills/manul-github-bot/test_github_control_protocol.sh
    skills/manul-github-bot/test_github_control_integration.sh
    skills/manul-github-bot/test_prompt_generation.sh
    skills/manul-github-bot/test_conversation_orchestrator.sh
    skills/manul-github-bot/test_conversation_regressions.sh

jobs:
  verify:
    name: Verify skills and Manul tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - name: Apply targeted poll fix
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 19 && github.event.pull_request.head.sha == 'aed753c37c6e674bde2de37ef533c6f690cf3534'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('skills/manul-github-bot/poll.sh')
          s = p.read_text()
          old = '''  local esc_repo esc_author esc_body esc_url esc_type message_id
  esc_repo="$(sql_escape "$repo")"
  esc_author="$(sql_escape "$author")"
  esc_body="$(sql_escape "$body")"
  esc_url="$(sql_escape "$url")"
  esc_type="$(sql_escape "$message_type")"
  message_id="$(uuidgen)"
'''
          new = '''  local esc_repo esc_author esc_body esc_url esc_type message_id
  esc_repo="$(sql_escape "$repo")"
  esc_author="$(sql_escape "$author")"
  esc_body="$(sql_escape "$body")"
  esc_url="$(sql_escape "$url")"
  esc_type="$(sql_escape "$message_type")"
  local already_persisted
  already_persisted="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"
  [ "$already_persisted" = "1" ] && return 0
  message_id="$(uuidgen)"
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''      agent="$(jq -r '.agent // ""' <<<"$obj")"
      action="$(jq -r '.action // ""' <<<"$obj")"
      [ -n "$prompt" ] || continue
      esc="$(printf '%s' "$prompt" | sed "s/'/''/g")"
'''
          new = '''      agent="$(jq -r '.agent // ""' <<<"$obj")"
      action="$(jq -r '.action // ""' <<<"$obj")"
      [ -n "$prompt" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue
      esc="$(printf '%s' "$prompt" | sed "s/'/''/g")"
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''      # Determine conversation ID based on comment count and thread structure
      raw_id="$(jq -r '.id' <<<"$obj")"
      raw_id="${raw_id#review:}"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      conv_id=""
      pr_comment_count="${PR_COMMENT_COUNTS[$pr_num]:-0}"
      if [ "$pr_comment_count" -eq 1 ]; then
        # Single standalone comment gets pr-top-level conversation
        conv_id="$(generate_conversation_id "$repo" "$pr_num" "pr-top-level")"
      elif [ -n "$reply_to" ]; then
        # Inline reply - find thread root
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
        [ -n "$root_id" ] && conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")"
      else
        # Top-level comment in a multi-comment PR gets review-thread with its own ID
        conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$raw_id")"
      fi
      [ -n "$conv_id" ] || continue
'''
          new = '''      raw_id="$(jq -r '.rawId // .id' <<<"$obj")"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      conv_id=""
      if [ -n "$reply_to" ]; then
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
      else
        root_id="$raw_id"
      fi
      [ -n "$root_id" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue
'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          s = s.replace('''      # Group review comments by thread root\n      local seen_roots=""\n      while IFS= read -r comment; do\n''', '      while IFS= read -r comment; do\n', 1)
          s = s.replace('''        # Skip if we've already processed this thread\n        echo "$seen_roots" | grep -qxF "$root_id" && continue\n        seen_roots="$(printf '%s\\n%s' "$seen_roots" "$root_id")"\n\n        # Create or get conversation for this review thread\n''', '        # Create or get conversation for this review thread\n', 1)
          p.write_text(s)
          PY
          bash -n skills/manul-github-bot/poll.sh
          bash skills/manul-github-bot/test_conversation_regressions.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/manul-github-bot/poll.sh
          git commit -m 'Fix conversation thread persistence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find skills/manul-github-bot -maxdepth 1 -type f -name '*.sh' -print | sort)
          for script in "${scripts[@]}"; do bash -n "$script"; done

      - name: Run configured Manul tests
        env:
          REQUESTED_TESTS: ${{ inputs.tests }}
        shell: bash
        run: |
          set -uo pipefail
          test_list="${REQUESTED_TESTS:-$MANUL_CI_TESTS}"
          mapfile -t requested < <(printf '%s\n' "$test_list" | sed '/^[[:space:]]*$/d')
          mkdir -p test-results
          passed=0
          failed=0
          for script in "${requested[@]}"; do
            log="test-results/$(basename "$script" .sh).log"
            if bash "$script" 2>&1 | tee "$log"; then passed=$((passed+1)); else failed=$((failed+1)); fi
          done
          echo "Passed suites: $passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed suites: $failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
