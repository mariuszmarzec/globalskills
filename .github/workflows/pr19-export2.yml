name: PR19 reviewed patch export

on:
  push:
    branches:
      - feature/auto-detect-manul-action

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('skills/manul-github-bot/poll.sh')
          s = p.read_text()

          s = s.replace(
              'raw_id="$(jq -r \'.rawId // $id\' <<<"$obj")"',
              'raw_id="$(jq -r \'.rawId // empty\' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#issue:}"',
              1,
          )
          s = s.replace(
              'raw_id="$(jq -r \'.rawId // $id\' <<<"$obj")"',
              'raw_id="$(jq -r \'.rawId // empty\' <<<"$obj")"\n      [ -n "$raw_id" ] || raw_id="${id#review:}"',
              1,
          )

          s = s.replace(
              '  message_id="$(uuidgen)"\n\n  sqlite3 "$DB" "',
              '''  local existing_message
  existing_message="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"
  [ "$existing_message" = "1" ] && return 0

  message_id="$(uuidgen)"

  sqlite3 "$DB" "''',
              1,
          )

          s = re.sub(
              r'''    # Build a lookup of PRs to their comment counts for conversation ID determination\n    declare -A PR_COMMENT_COUNTS=\(\)\n    while IFS= read -r line; do\n.*?    done < <\(printf '%s\\n' "\$review_comments" \| jq -c '\.\[\]' 2>/dev/null \|\| true\)\n\n''',
              '', s, count=1, flags=re.S)

          old_review = re.compile(
              r'''      # Determine conversation ID based on comment count and thread structure\n      raw_id="\$\(jq -r '\.id' <<<"\$obj"\)"\n      raw_id="\$\{raw_id#review:\}"\n      reply_to="\$\(jq -r '\.in_reply_to_id // empty' <<<"\$obj"\)"\n      conv_id=""\n      pr_comment_count="\$\{PR_COMMENT_COUNTS\[\$pr_num\]:-0\}"\n      if .*?      \[ -n "\$conv_id" \] \|\| continue\n''',
              re.S,
          )
          new_review = '''      # Review comments are always inline review-thread messages.
      raw_id="$(jq -r '.rawId // empty' <<<"$obj")"
      [ -n "$raw_id" ] || raw_id="${id#review:}"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      if [ -n "$reply_to" ]; then
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
      else
        root_id="$raw_id"
      fi
      [ -n "$root_id" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue
'''
          s, n = old_review.subn(new_review, s, count=1)
          if n != 1:
              raise SystemExit('review identity block not found')

          s = s.replace('      local seen_roots=""\n', '', 1)
          s = re.sub(
              r'''        # Skip if we've already processed this thread\n        echo "\$seen_roots" \| grep -qxF "\$root_id" && continue\n        seen_roots="\$\(printf '%s\\n%s' "\$seen_roots" "\$root_id"\)"\n\n        # Create or get conversation for this review thread\n''',
              '        # Create or get conversation for this review thread\n',
              s, count=1, flags=re.S)

          issue_body = s.index('    # 1b) Issue bodies')
          marker = '      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      lease_expires='
          pos = s.index(marker, issue_body)
          s = s[:pos] + s[pos:].replace(marker, '      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue\n      lease_expires=', 1)

          p.write_text(s)
          print('patched poll.sh', len(s), 'bytes')
          PY

          bash -n skills/manul-github-bot/poll.sh
          cp skills/manul-github-bot/poll.sh patched-poll.sh
          cp .github/workflows/build.yml patched-build.yml
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-reviewed-patch
          path: |
            patched-poll.sh
            patched-build.yml
