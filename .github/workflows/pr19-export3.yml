name: PR19 final patch export

on:
  push:
    branches:
      - feature/auto-detect-manul-action

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patch artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('skills/manul-github-bot/poll.sh')
          lines = p.read_text().splitlines(True)
          text = ''.join(lines)

          # rawId fallback: operate only on the two exact bad expressions.
          bad = 'raw_id="$(jq -r \'.rawId // $id\' <<<"$obj")"'
          positions = [m.start() for m in re.finditer(re.escape(bad), text)]
          if len(positions) == 2:
              first = '        raw_id="$(jq -r \'.rawId // empty\' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#issue:}"'
              second = '        raw_id="$(jq -r \'.rawId // empty\' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#review:}"'
              text = text.replace(bad, first, 1).replace(bad, second, 1)
          else:
              raise SystemExit(f'expected 2 raw_id expressions, found {len(positions)}')

          # Comment-level idempotency, keyed by conversationId + GitHub commentId.
          needle = '  message_id="$(uuidgen)"\n'
          if 'SELECT 1 FROM conversation_messages' not in text:
              text = text.replace(needle, '''  local existing_message
  existing_message="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"
  [ "$existing_message" = "1" ] && return 0

  message_id="$(uuidgen)"
''', 1)

          # Remove PR_COMMENT_COUNTS collection; review comments are intrinsically inline review threads.
          text = re.sub(r'''    # Build a lookup of PRs to their comment counts for conversation ID determination\n    declare -A PR_COMMENT_COUNTS=\(\)\n    while IFS= read -r line; do.*?    done < <\(printf '%s\\n' "\$review_comments" \| jq -c '\.\[\]' 2>/dev/null \|\| true\)\n\n''', '', text, count=1, flags=re.S)

          old = re.compile(r'''      # Determine conversation ID based on comment count and thread structure\n      raw_id="\$\(jq -r '\.id' <<<"\$obj"\)"\n      raw_id="\$\{raw_id#review:\}"\n      reply_to="\$\(jq -r '\.in_reply_to_id // empty' <<<"\$obj"\)"\n      conv_id=""\n      pr_comment_count="\$\{PR_COMMENT_COUNTS\[\$pr_num\]:-0\}"\n      if \[ "\$pr_comment_count" -eq 1 \]; then.*?      \[ -n "\$conv_id" \] \|\| continue\n''', re.S)
          new = '''      # Review comments are always inline review-thread messages.
      raw_id="$(jq -r '.rawId // empty' <<<"$obj")"
      [ -n "$raw_id" ] || raw_id="${id#review:}"
      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"
      if [ -n "$reply_to" ]; then
        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"
      else
        root_id="$raw_id"
      fi
      [ -n "$root_id" ] || continue
      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue
'''
          text, count = old.subn(new, text, count=1)
          if count != 1:
              raise SystemExit('review conversation block not found')

          text = text.replace('      local seen_roots=""\n', '', 1)
          text = re.sub(r'''        # Skip if we've already processed this thread\n        echo "\$seen_roots" \| grep -qxF "\$root_id" && continue\n        seen_roots="\$\(printf '%s\\n%s' "\$seen_roots" "\$root_id"\)"\n\n''', '', text, count=1, flags=re.S)

          # Recompute issue-body conversation id inside its own processing loop.
          marker = '      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      lease_expires='
          issue_pos = text.index('    # 1b) Issue bodies')
          marker_pos = text.index(marker, issue_pos)
          tail = text[marker_pos:]
          if 'conv_id="$(generate_conversation_id "$repo" "$issue" "issue")"' not in tail[:200]:
              text = text[:marker_pos] + text[marker_pos:].replace(marker, '      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue\n      lease_expires=', 1)

          p.write_text(text)
          Path('patched-poll.sh').write_text(text)
          Path('patched-build.yml').write_text(Path('.github/workflows/build.yml').read_text())
          PY
          bash -n patched-poll.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-final-patch
          path: patched-poll.sh
