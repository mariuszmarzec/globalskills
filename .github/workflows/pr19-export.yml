name: PR19 patch export

on:
  push:
    branches:
      - feature/auto-detect-manul-action

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patched files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('skills/manul-github-bot/poll.sh')
          s = p.read_text()
          old = '''        raw_id="$(jq -r '.rawId // $id' <<<"$obj")"'''
          assert s.count(old) == 2
          s = s.replace(old, '''        raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#issue:}"''', 1)
          s = s.replace(old, '''        raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#review:}"''', 1)
          old = '''  message_id="$(uuidgen)"\n\n  sqlite3 "$DB" "'''
          new = '''  local existing_message\n  existing_message="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"\n  [ "$existing_message" = "1" ] && return 0\n\n  message_id="$(uuidgen)"\n\n  sqlite3 "$DB" "'''
          assert old in s
          s = s.replace(old, new, 1)
          start = s.index('    # Build a lookup of PRs to their comment counts for conversation ID determination')
          end = s.index('    while IFS= read -r obj; do', start)
          s = s[:start] + s[end:]
          old = '''      # Determine conversation ID based on comment count and thread structure\n      raw_id="$(jq -r '.id' <<<"$obj")"\n      raw_id="${raw_id#review:}"\n      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"\n      conv_id=""\n      pr_comment_count="${PR_COMMENT_COUNTS[$pr_num]:-0}"\n      if [ "$pr_comment_count" -eq 1 ]; then\n        # Single standalone comment gets pr-top-level conversation\n        conv_id="$(generate_conversation_id "$repo" "$pr_num" "pr-top-level")"\n      elif [ -n "$reply_to" ]; then\n        # Inline reply - find thread root\n        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"\n        [ -n "$root_id" ] && conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")"\n      else\n        # Top-level comment in a multi-comment PR gets review-thread with its own ID\n        conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$raw_id")"\n      fi\n      [ -n "$conv_id" ] || continue\n'''
          new = '''      raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n      [ -n "$raw_id" ] || raw_id="${id#review:}"\n      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"\n      if [ -n "$reply_to" ]; then\n        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"\n      else\n        root_id="$raw_id"\n      fi\n      [ -n "$root_id" ] || continue\n      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        # Skip if we've already processed this thread\n        echo "$seen_roots" | grep -qxF "$root_id" && continue\n        seen_roots="$(printf '%s\\n%s' "$seen_roots" "$root_id")"\n\n        # Create or get conversation for this review thread\n'''
          new = '''        # Create or get conversation for this review thread\n'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('      local seen_roots=""\n', '', 1)
          marker = '''      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      lease_expires="$(date -u -d "now + $LEASE_TIMEOUT seconds" +%Y-%m-%dT%H:%M:%SZ)"'''
          replacement = '''      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue\n      lease_expires="$(date -u -d "now + $LEASE_TIMEOUT seconds" +%Y-%m-%dT%H:%M:%SZ)"'''
          # Replace the FIRST exact occurrence after the issue-body section.
          issue_body = s.index('    # 1b) Issue bodies')
          pos = s.index(marker, issue_body)
          s = s[:pos] + s[pos:].replace(marker, replacement, 1)
          p.write_text(s)
          Path('patched-poll.sh').write_text(s)
          Path('patched-build.yml').write_text(Path('.github/workflows/build.yml').read_text().replace('    skills/manul-github-bot/test_conversation_orchestrator.sh\n', '    skills/manul-github-bot/test_conversation_orchestrator.sh\n    skills/manul-github-bot/test_conversation_regressions.sh\n', 1))
          PY
          cp skills/manul-github-bot/test_conversation_regressions.sh patched-regression-test.sh 2>/dev/null || true
          bash -n patched-poll.sh
          test -s patched-poll.sh
          ls -l patched-poll.sh patched-build.yml patched-regression-test.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-patched-files
          path: |
            patched-poll.sh
            patched-build.yml
            patched-regression-test.sh
