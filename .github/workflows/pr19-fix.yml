name: PR19 fix runner

on:
  push:
    branches:
      - feature/auto-detect-manul-action

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[pr19-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PR19 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('skills/manul-github-bot/poll.sh')
          s = p.read_text()

          old = '''        raw_id="$(jq -r '.rawId // $id' <<<"$obj")"'''
          assert s.count(old) == 2, f'raw_id pattern count={s.count(old)}'
          s = s.replace(old, '''        raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#issue:}"''', 1)
          s = s.replace(old, '''        raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n        [ -n "$raw_id" ] || raw_id="${id#review:}"''', 1)

          old = '''  local esc_repo esc_author esc_body esc_url esc_type message_id\n  esc_repo="$(sql_escape "$repo")"\n  esc_author="$(sql_escape "$author")"\n  esc_body="$(sql_escape "$body")"\n  esc_url="$(sql_escape "$url")"\n  esc_type="$(sql_escape "$message_type")"\n  message_id="$(uuidgen)"\n\n  sqlite3 "$DB" "'''
          new = '''  local esc_repo esc_author esc_body esc_url esc_type message_id\n  esc_repo="$(sql_escape "$repo")"\n  esc_author="$(sql_escape "$author")"\n  esc_body="$(sql_escape "$body")"\n  esc_url="$(sql_escape "$url")"\n  esc_type="$(sql_escape "$message_type")"\n\n  # Idempotency is keyed by the GitHub comment identity, not by random UUID.\n  local existing_message\n  existing_message="$(sqlite3 "$DB" "SELECT 1 FROM conversation_messages WHERE conversationId='$(sql_escape "$conv_id")' AND commentId='$(sql_escape "$comment_id")' LIMIT 1;" 2>/dev/null || true)"\n  [ "$existing_message" = "1" ] && return 0\n\n  message_id="$(uuidgen)"\n\n  sqlite3 "$DB" "'''
          assert old in s, 'persist message block not found'
          s = s.replace(old, new, 1)

          start = s.index('    # Build a lookup of PRs to their comment counts for conversation ID determination')
          end = s.index('    while IFS= read -r obj; do', start)
          s = s[:start] + s[end:]

          old = '''      # Determine conversation ID based on comment count and thread structure\n      raw_id="$(jq -r '.id' <<<"$obj")"\n      raw_id="${raw_id#review:}"\n      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"\n      conv_id=""\n      pr_comment_count="${PR_COMMENT_COUNTS[$pr_num]:-0}"\n      if [ "$pr_comment_count" -eq 1 ]; then\n        # Single standalone comment gets pr-top-level conversation\n        conv_id="$(generate_conversation_id "$repo" "$pr_num" "pr-top-level")"\n      elif [ -n "$reply_to" ]; then\n        # Inline reply - find thread root\n        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"\n        [ -n "$root_id" ] && conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")"\n      else\n        # Top-level comment in a multi-comment PR gets review-thread with its own ID\n        conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$raw_id")"\n      fi\n      [ -n "$conv_id" ] || continue\n'''
          new = '''      # Review comments are always inline review-thread messages.\n      # A root comment starts its own thread; replies reuse that root thread.\n      raw_id="$(jq -r '.rawId // empty' <<<"$obj")"\n      [ -n "$raw_id" ] || raw_id="${id#review:}"\n      reply_to="$(jq -r '.in_reply_to_id // empty' <<<"$obj")"\n      if [ -n "$reply_to" ]; then\n        root_id="$(get_review_thread_root_id "$review_comments" "$raw_id")"\n      else\n        root_id="$raw_id"\n      fi\n      [ -n "$root_id" ] || continue\n      conv_id="$(generate_conversation_id "$repo" "$pr_num" "review-thread" "$root_id")" || continue\n'''
          assert old in s, 'review conversation block not found'
          s = s.replace(old, new, 1)

          old = '''        # Skip if we've already processed this thread\n        echo "$seen_roots" | grep -qxF "$root_id" && continue\n        seen_roots="$(printf '%s\\n%s' "$seen_roots" "$root_id")"\n\n        # Create or get conversation for this review thread\n'''
          new = '''        # Create or get conversation for this review thread\n'''
          assert old in s, 'seen_roots block not found'
          s = s.replace(old, new, 1)
          s = s.replace('      local seen_roots=""\n', '', 1)

          old = '''      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      lease_expires="$(date -u -d "now + $LEASE_TIMEOUT seconds" +%Y-%m-%dT%H:%M:%SZ)"\n      ins="$(sqlite3 "$DB" "INSERT OR IGNORE INTO processed_comments'''
          new = '''      now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n      conv_id="$(generate_conversation_id "$repo" "$issue" "issue")" || continue\n      lease_expires="$(date -u -d "now + $LEASE_TIMEOUT seconds" +%Y-%m-%dT%H:%M:%SZ)"\n      ins="$(sqlite3 "$DB" "INSERT OR IGNORE INTO processed_comments'''
          # This exact sequence occurs in issue-body handling only after the issue-comment block.
          assert old in s, 'issue-body conv_id insertion point not found'
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('skills/manul-github-bot/test_conversation_regressions.sh')
          t.write_text(r'''#!/usr/bin/env bash
set -uo pipefail

SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"

fail() { echo "FAIL: $*" >&2; exit 1; }

# -----------------------------------------------------------------------------
# 1) Canonical review-thread identity + full-thread persistence.
# -----------------------------------------------------------------------------
TEST_ROOT="$(mktemp -d /tmp/manul-conv-regression-XXXXXX)"
trap 'rm -rf "$TEST_ROOT"' EXIT
export MANUL_DIR="$TEST_ROOT/manul"
export PATH="$TEST_ROOT/bin:$PATH"
mkdir -p "$MANUL_DIR" "$TEST_ROOT/bin"
cat > "$MANUL_DIR/config.json" <<'EOF'
{"automation":{"leaseTimeout":900},"repositories":["test-org/test-repo"],"allowedUsers":["test-user"],"ciFix":{"enabled":false},"trigger":"/manul"}
EOF
cat > "$TEST_ROOT/bin/gh" <<'EOF'
#!/usr/bin/env bash
set -u
case "${1:-}" in
  pr)
    case "${2:-}" in
      list)
        if [[ "$*" == *"--state open"* ]]; then
          echo '[{"number":200,"headRefName":"main","baseRefName":"main","title":"Test","url":"https://github.com/test-org/test-repo/pull/200"}]'
        else
          echo '[]'
        fi
        ;;
      view) echo '{"number":200,"url":"https://github.com/test-org/test-repo/pull/200"}' ;;
    esac
    ;;
  issue)
    case "${2:-}" in
      list) echo '[]' ;;
      view) echo '{"number":1,"title":"Test","body":""}' ;;
    esac
    ;;
  api)
    args="$*"
    if [[ "$args" == *"/issues/200/comments"* ]]; then
      echo '[]'
    elif [[ "$args" == *"/pulls/200/comments"* ]]; then
      echo '[
        {"id":101,"user":{"login":"test-user"},"body":"root A","html_url":"https://github.com/test-org/test-repo/pull/200#discussion_101","created_at":"2026-01-01T00:00:01Z"},
        {"id":102,"in_reply_to_id":101,"user":{"login":"test-user"},"body":"reply B","html_url":"https://github.com/test-org/test-repo/pull/200#discussion_102","created_at":"2026-01-01T00:00:02Z"},
        {"id":103,"in_reply_to_id":102,"user":{"login":"test-user"},"body":"reply C","html_url":"https://github.com/test-org/test-repo/pull/200#discussion_103","created_at":"2026-01-01T00:00:03Z"},
        {"id":201,"user":{"login":"test-user"},"body":"root D","html_url":"https://github.com/test-org/test-repo/pull/200#discussion_201","created_at":"2026-01-01T00:00:04Z"}
      ]'
    elif [[ "$args" == *"/pulls/200/reviews"* ]]; then
      echo '[]'
    elif [[ "$args" == *"/issues/comments"* ]]; then
      echo '[]'
    elif [[ "$args" == *"/issues?state=open"* ]]; then
      echo '[]'
    else
      echo '[]'
    fi
    ;;
esac
EOF
chmod +x "$TEST_ROOT/bin/gh"

# Source the production poller without executing its main loop.
bash -n "$SCRIPT_DIR/poll.sh" || fail "poll.sh syntax"
source "$SCRIPT_DIR/poll.sh"
declare -A OPEN_ISSUES=() CLOSED_ISSUES=() OPEN_PRS=([200]=1) MERGED_PRS=() CLOSED_PRS=()

conv_a="$(generate_conversation_id test-org/test-repo 200 review-thread 101)"
conv_b="$(generate_conversation_id test-org/test-repo 200 review-thread 201)"
[ "$conv_a" = "conv-test-org/test-repo-review-101" ] || fail "wrong root conversation id: $conv_a"
[ "$conv_b" = "conv-test-org/test-repo-review-201" ] || fail "wrong second root conversation id: $conv_b"
[ "$(get_review_thread_root_id '[{"id":101},{"id":102,"in_reply_to_id":101},{"id":103,"in_reply_to_id":102}]' 103)" = "101" ] || fail "root traversal failed"

sqlite3 "$DB" "INSERT INTO processed_comments(commentId,repository,issueNumber,commentUrl,author,agent,prompt,status,createdAt,conversationId) VALUES('seed','test-org/test-repo',200,'https://github.com/test-org/test-repo/pull/200','test-user','','seed','completed','2026-01-01T00:00:00Z','conv-test-org/test-repo-review-101');"
persist_conversation_messages_for_repo test-org/test-repo
count_a="$(sqlite3 "$DB" "SELECT COUNT(*) FROM conversation_messages WHERE conversationId='$conv_a';")"
count_b="$(sqlite3 "$DB" "SELECT COUNT(*) FROM conversation_messages WHERE conversationId='$conv_b';")"
[ "$count_a" -eq 3 ] || fail "expected 3 messages in root 101 thread, got $count_a"
[ "$count_b" -eq 1 ] || fail "expected 1 message in root 201 thread, got $count_b"

# Repeat backfill: no duplicate rows.
persist_conversation_messages_for_repo test-org/test-repo
[ "$(sqlite3 "$DB" "SELECT COUNT(*) FROM conversation_messages WHERE conversationId='$conv_a';")" -eq 3 ] || fail "duplicate review messages after repeat"

# -----------------------------------------------------------------------------
# 2) Exact persistent issue conversation E2E: trigger -> feedback -> trigger.
# -----------------------------------------------------------------------------
TEST_ROOT2="$(mktemp -d /tmp/manul-persistent-e2e-XXXXXX)"
trap 'rm -rf "$TEST_ROOT2"' EXIT
export MANUL_DIR="$TEST_ROOT2/manul"
export PATH="$TEST_ROOT2/bin:$PATH"
mkdir -p "$MANUL_DIR" "$TEST_ROOT2/bin"
cat > "$MANUL_DIR/config.json" <<'EOF'
{"automation":{"leaseTimeout":900},"repositories":["test-org/test-repo"],"allowedUsers":["test-user"],"ciFix":{"enabled":false},"trigger":"/manul"}
EOF
cat > "$TEST_ROOT2/bin/gh" <<'EOF'
#!/usr/bin/env bash
set -u
POLL_FILE="$(dirname "${MANUL_DIR}")/poll_number"
POLL="$(cat "$POLL_FILE" 2>/dev/null || echo 1)"
case "${1:-}" in
  pr)
    case "${2:-}" in
      list) echo '[]' ;;
      view) echo '{}' ;;
    esac
    ;;
  issue)
    case "${2:-}" in
      list) echo '[{"number":1}]' ;;
      view) echo '{"number":1,"title":"multiply","body":""}' ;;
    esac
    ;;
  api)
    args="$*"
    if [[ "$args" == *"/issues/comments"* ]]; then
      case "$POLL" in
        1) echo '[{"id":1001,"user":{"login":"test-user"},"body":"/manul Add a test for multiply(2, 3) == 6","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1001","created_at":"2026-01-01T00:00:01Z"}]' ;;
        2) echo '[{"id":1001,"user":{"login":"test-user"},"body":"/manul Add a test for multiply(2, 3) == 6","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1001","created_at":"2026-01-01T00:00:01Z"},{"id":1002,"user":{"login":"test-user"},"body":"Also make sure the assertion uses float comparison.","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1002","created_at":"2026-01-01T00:00:02Z"}]' ;;
        *) echo '[{"id":1001,"user":{"login":"test-user"},"body":"/manul Add a test for multiply(2, 3) == 6","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1001","created_at":"2026-01-01T00:00:01Z"},{"id":1002,"user":{"login":"test-user"},"body":"Also make sure the assertion uses float comparison.","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1002","created_at":"2026-01-01T00:00:02Z"},{"id":1003,"user":{"login":"test-user"},"body":"/manul Now implement the change according to my previous feedback.","html_url":"https://github.com/test-org/test-repo/issues/1#issuecomment-1003","created_at":"2026-01-01T00:00:03Z"}]' ;;
      esac
    elif [[ "$args" == *"/issues?state=open"* ]]; then
      echo '[]'
    elif [[ "$args" == *"/pulls/comments"* ]]; then
      echo '[]'
    else
      echo '[]'
    fi
    ;;
esac
EOF
chmod +x "$TEST_ROOT2/bin/gh"

for poll in 1 2 3 4; do
  echo "$poll" > "$TEST_ROOT2/poll_number"
  bash "$SCRIPT_DIR/poll.sh" test-org/test-repo >/tmp/manul-persistent-e2e.out 2>/tmp/manul-persistent-e2e.err || fail "poll $poll failed"
  case "$poll" in
    1) [ "$(sqlite3 "$MANUL_DIR/manul.db" "SELECT COUNT(*) FROM processed_comments WHERE commentId LIKE 'issue:%';")" -eq 1 ] || fail "poll1 task count" ;;
    2) [ "$(sqlite3 "$MANUL_DIR/manul.db" "SELECT COUNT(*) FROM processed_comments WHERE commentId LIKE 'issue:%';")" -eq 1 ] || fail "ordinary feedback created a task"; [ "$(sqlite3 "$MANUL_DIR/manul.db" "SELECT COUNT(*) FROM conversation_messages WHERE commentId='1002';")" -eq 1 ] || fail "feedback was not persisted" ;;
    3) [ "$(sqlite3 "$MANUL_DIR/manul.db" "SELECT COUNT(*) FROM processed_comments WHERE commentId LIKE 'issue:%';")" -eq 2 ] || fail "poll3 task count" ;;
    4) [ "$(sqlite3 "$MANUL_DIR/manul.db" "SELECT COUNT(*) FROM processed_comments WHERE commentId LIKE 'issue:%';")" -eq 2 ] || fail "poll4 created task3" ;;
  esac
done

DB2="$MANUL_DIR/manul.db"
conv_count="$(sqlite3 "$DB2" "SELECT COUNT(DISTINCT conversationId) FROM processed_comments WHERE commentId LIKE 'issue:%';")"
msg_count="$(sqlite3 "$DB2" "SELECT COUNT(*) FROM conversation_messages WHERE conversationId=(SELECT conversationId FROM processed_comments WHERE commentId='issue:1003');")"
[ "$conv_count" -eq 1 ] || fail "tasks do not share conversation"
[ "$msg_count" -eq 3 ] || fail "expected 3 conversation messages, got $msg_count"
ctx="$(sqlite3 "$DB2" "SELECT context FROM processed_comments WHERE commentId='issue:1003';")"
[[ "$ctx" == *"Add a test for multiply(2, 3) == 6"* ]] || fail "task2 missing first message"
[[ "$ctx" == *"float comparison"* ]] || fail "task2 missing feedback"
[[ "$ctx" == *"Now implement the change according to my previous feedback"* ]] || fail "task2 missing third message"
[[ "$ctx" == *"1001"* && "$ctx" == *"1002"* && "$ctx" == *"1003"* ]] || fail "task2 context is not complete"

# Issue-body conv_id must be computed locally rather than leaked from a previous loop.
awk 'BEGIN{ok=0} /# 1b\) Issue bodies/{inbody=1} inbody && /conv_id="\$\(generate_conversation_id "\$repo" "\$issue" "issue"\)"/{ok=1} END{exit(ok?0:1)}' "$SCRIPT_DIR/poll.sh" || fail "issue-body conv_id is not explicit"

echo "PASS: conversation regressions"
''')
          t.chmod(0o755)

          w = Path('.github/workflows/build.yml')
          ws = w.read_text()
          marker = '    skills/manul-github-bot/test_conversation_orchestrator.sh\n'
          addition = marker + '    skills/manul-github-bot/test_conversation_regressions.sh\n'
          assert marker in ws, 'build.yml test allowlist marker not found'
          assert 'test_conversation_regressions.sh' not in ws
          w.write_text(ws.replace(marker, addition, 1))
          PY

          chmod +x skills/manul-github-bot/test_conversation_regressions.sh
          bash -n skills/manul-github-bot/poll.sh
          bash skills/manul-github-bot/test_conversation_regressions.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/manul-github-bot/poll.sh skills/manul-github-bot/test_conversation_regressions.sh .github/workflows/build.yml
          git commit -m 'Fix PR19 conversation thread semantics [pr19-fixed]'
          git push
